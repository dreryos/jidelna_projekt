<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Jídelna{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:2rem}
    header{margin-bottom:1rem}
    nav a{margin-right:1rem}
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Domů</a>
      <a href="/admin/">Administrace</a>
      <a href="{% url 'reports:order_report' %}">Reporty</a>
      {% if request.user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button type="submit">Odhlásit</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Přihlásit</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <small>Jídelna projekt — interní nástroj</small>
  </footer>
</body>
</html>
