{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}
{% block content %}
  <h1>Přihlášení</h1>
  {% if form.errors %}
    <p class="error">Chyba při přihlášení, zkontrolujte uživatelské jméno a heslo.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div>
      <label for="id_username">Uživatelské jméno:</label>
      {{ form.username }}
    </div>
    <div>
      <label for="id_password">Heslo:</label>
      {{ form.password }}
    </div>
    <button type="submit">Přihlásit</button>
  </form>
{% endblock %}
