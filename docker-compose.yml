services:
  spiz:
    image: dreryos/jidelna_projekt:latest
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      # Nahrané skeny dokladů. Jsou dočasné (mažou se po potvrzení příjemky,
      # nejpozději po OCR_SCAN_RETENTION_DAYS), ale rozdělaný import nesmí
      # restart kontejneru shodit.
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ALLOWED_HOSTS=spiz.yourdomain.com,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://spiz.yourdomain.com,http://spiz.yourdomain.com
      - SECRET_KEY=change_me_in_production
      - DEBUG=False
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      # Superuser creation (optional)
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=admin
      - MEDIA_ROOT=/app/media
      # Načítání příjemek z fotky. Bez klíče je funkce nedostupná,
      # zbytek aplikace běží normálně. Klíč patří do .env, ne sem.
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OCR_SCAN_RETENTION_DAYS=7
    # Pozor: tenhle command přebíjí docker-entrypoint.sh, takže kroky, které
    # mají běžet při startu, musí být i tady.
    # Nefatální je jen úklid skenů; migrace, statika a superuser musí projít,
    # jinak by Gunicorn nastartoval nad nemigrovanou databází.
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python create_superuser.py &&
      { python manage.py purge_receipt_scans || true; } &&
      gunicorn --bind 0.0.0.0:8000 spiz_project.wsgi:application"

volumes:
  sqlite_data:
  static_volume:
  media_volume:
