# Testy při každém PR, publikace image po merge do main.
#
# Proč to vzniklo: image se dosud stavěl ručně z pracovní kopie. Tím se do
# veřejného image dostaly soubory, které v gitu nejsou - `.env` a dvě kompletní
# kopie ostré databáze ze složky `backups/`. CI staví z čistého `git clone`,
# takže netrackované soubory se do build kontextu nemají jak dostat. Opravená
# `.dockerignore` je druhá vrstva téže obrany, ne náhrada.
#
# Runnery jsou `ubuntu-24.04-arm`, tedy nativní arm64: cílový stroj je Oracle
# Ampere A1. Na x86 runneru by se muselo emulovat přes QEMU a build by trval
# násobně dýl. Pro veřejné repozitáře jsou tyhle runnery zdarma a bez limitu
# minut.

name: Testy a publikace image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testy:
    name: Testy nad PostgreSQL
    runs-on: ubuntu-24.04-arm

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spiz
          POSTGRES_USER: spiz
          # Heslo jen pro běh testů v izolovaném kontejneru, který zanikne
          # s jobem. Nic ostrého tu být nesmí - workflow je veřejně čitelný.
          POSTGRES_PASSWORD: spiz-test
        ports:
          - 5432:5432
        # Bez healthchecku by testy startovaly dřív, než je databáze nahoře.
        options: >-
          --health-cmd "pg_isready -U spiz -d spiz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: spiz
      POSTGRES_USER: spiz
      POSTGRES_PASSWORD: spiz-test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      # Testy si WeasyPrint mockují, takže by se dnes bez těchhle knihoven
      # obešly. Instalují se proto, že první test, který si ho nemockne,
      # by jinak spadl na chybějícím libpango - a to je hláška, u které
      # nikoho nenapadne hledat příčinu v CI.
      - name: Systémové knihovny pro WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info

      # Vývojový soubor - stáhne i produkční requirements.txt a navíc pytest.
      - name: Instalace závislostí
        run: pip install -r requirements-dev.txt

      # `pytest apps test`, ne holý `pytest` - viz CLAUDE.md. Testy běží nad
      # skutečným PostgreSQL, protože SQLite `select_for_update()` ignoruje
      # a souběhové testy by nad ní neověřovaly nic.
      - name: Testy
        run: python -m pytest apps test

      - name: Kontrola projektu
        run: python manage.py check

  image:
    name: Build a publikace image
    needs: testy
    # Jen po merge do main. PR se otestuje, ale nic nepublikuje - jinak by
    # kdokoli s otevřeným PR přepsal `latest`.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN stačí, žádný ručně spravovaný token do ghcr.io netřeba.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Dva tagy schválně. `latest` je to, co táhne server; `sha-<commit>`
          # je to, čím se dá vrátit na verzi, která běžela minulý týden.
          # Bez druhého tagu není návrat zpátky na co zavěsit.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Shrnutí
        run: |
          echo "### Image publikován" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
