[pytest]
DJANGO_SETTINGS_MODULE = spiz_project.settings
testpaths = test
; Starší soubory v test/ jsou skripty (zapisují do ostré DB při importu),
; pytest je nesmí kolektovat.
addopts =
    --ignore=test/test_form_readonly.py
    --ignore=test/test_ingredient_deletion.py
    --ignore=test/test_ingredient_soft_delete.py
    --ignore=test/test_vat_implementation.py
    --ignore=test/test_visual_editor.py
