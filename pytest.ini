[pytest]
DJANGO_SETTINGS_MODULE = spiz_project.settings
testpaths = test
; Django zakládá testy jako `tests.py`, pytest ale ve výchozím nastavení
; sbírá jen `test_*.py`. Bez tohohle řádku se testy v apps/core, apps/inventory
; a apps/bufet tiše nespouštěly - `pytest apps test` je prošel a nikdy si
; jich nevšiml.
python_files = test_*.py *_test.py tests.py
; Starší soubory v test/ jsou skripty (zapisují do ostré DB při importu),
; pytest je nesmí kolektovat.
addopts =
    --ignore=test/test_form_readonly.py
    --ignore=test/test_ingredient_deletion.py
    --ignore=test/test_ingredient_soft_delete.py
    --ignore=test/test_vat_implementation.py
    --ignore=test/test_visual_editor.py
; Jednorázové ověřovací skripty k převodu na PostgreSQL - připojují se
; k ostrým databázím, ne k testovací.
    --ignore=test/verify_migration.py
    --ignore=test/verify_collation.py
